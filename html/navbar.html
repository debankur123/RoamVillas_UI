<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title></title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <!-- ══════════════════════════════════
       Logout Confirmation Modal
  ═══════════════════════════════════ -->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="modal-header border-0" style="background: #fff8e1">
            <div class="d-flex align-items-center gap-2">
              <div
                style="
                  width: 36px;
                  height: 36px;
                  border-radius: 50%;
                  background: #fef3c7;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <i class="bi bi-box-arrow-right text-warning"></i>
              </div>
              <h6 class="modal-title fw-semibold mb-0" style="color: #92400e">
                Sign Out
              </h6>
            </div>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body px-4 py-3">
            <p
              class="mb-0 text-secondary"
              style="font-size: 0.9rem; line-height: 1.6"
            >
              Are you sure you want to sign out of <strong>RoamVillas</strong>?
            </p>
          </div>

          <div class="modal-footer border-0 pt-0 gap-2">
            <button
              type="button"
              class="btn btn-outline-secondary btn-sm px-3"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-warning btn-sm px-3 text-dark fw-semibold"
              onclick="confirmLogout()"
            >
              <i class="bi bi-box-arrow-right me-1"></i>Yes, Sign Out
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════
       Navbar
  ═══════════════════════════════════ -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top"
    >
      <div class="container">
        <!-- Brand -->
        <a class="navbar-brand fw-bold fs-3" href="../html/home.html">
          <i class="bi bi-house-heart-fill text-info"></i>
          RoamVillas
        </a>

        <!-- Mobile Toggle -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="mainNavbar">
          <!-- Left links -->
          <ul class="navbar-nav me-auto align-items-lg-center">
            <li class="nav-item mx-2">
              <a class="nav-link fw-semibold" href="../html/home.html">
                <i class="bi bi-house-door-fill me-1"></i>Home
              </a>
            </li>

            <li class="nav-item mx-2">
              <a class="nav-link fw-semibold" href="../html/villalist.html">
                <i class="bi bi-buildings-fill me-1"></i>Villa Management
              </a>
            </li>
          </ul>

          <!-- Right side — auth area injected by layout.js -->
          <ul class="navbar-nav align-items-lg-center gap-2" id="navAuthArea">
            <!-- Populated dynamically -->
          </ul>
        </div>
      </div>
    </nav>
  </body>
</html>
