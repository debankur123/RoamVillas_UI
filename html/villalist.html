<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="../css/home.css" rel="stylesheet" />
</head>
<body>
    <div id="navbarContainer"></div>
    <div class="container my-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Villa Management</h2>
                <p class="text-muted mb-0">Manage your villa listings</p>
            </div>
            <a href="#" class="btn btn-success">
                <i class="bi bi-plus-circle me-2"></i>Add New Villa
            </a>
        </div>

        <!-- Messages -->

        <div id="successAlert"
             class="alert alert-success alert-dismissible fade show d-none"
             role="alert">

            <i class="bi bi-check-circle me-2"></i>
            <span id="successMessage">
                Success
            </span>
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>
        </div>

        <div id="errorAlert"
             class="alert alert-danger alert-dismissible fade show d-none"
             role="alert">

            <i class="bi bi-exclamation-triangle me-2"></i>

            <span id="errorMessage">
                Error
            </span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>
        </div>

        <div id="noVillaBlock"
             class="alert alert-info text-center d-none">

            <i class="bi bi-info-circle fs-1 d-block mb-3"></i>

            <h5>No Villas Available</h5>

            <p class="mb-3">
                Get started by creating your first villa.
            </p>

            <a href="#"
               class="btn btn-primary">

                <i class="bi bi-plus-circle me-2"></i>
                Create Villa
            </a>
        </div>

        <!-- Villa Table -->
        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Details</th>
                                <th>Rate</th>
                                <th>Occupancy</th>
                                <th>Sqft</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="villaTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Summary -->
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="text-primary">Count</h5>
                        <small class="text-muted">Total Villas</small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="text-success">$$$</h5>
                        <small class="text-muted">Average Rate</small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="text-info">Sqft</h5>
                        <small class="text-muted">Total Sqft</small>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    <script src="../js/error.js"></script>
    <script src="../js/villalist.js"></script>
    <script src="../js/layout.js"></script>
    <style>
        .object-fit-cover {
            object-fit: cover;
        }
    </style>

</body>
</html>
